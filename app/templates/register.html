{% extends "base.html" %}

{% block title %}إنشاء حساب جديد | FastAPI Auth{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="card-header">
      <h2 class="card-title">إنشاء حساب جديد</h2>
      <p class="card-subtitle">انضم إلينا الآن وتمتع بالوصول إلى لوحة التحكم الآمنة</p>
    </div>

    <!-- Notification Alert -->
    <div id="register-alert" class="alert"></div>

    <form id="register-form">
      <!-- Full Name -->
      <div class="form-group">
        <label for="full_name" class="form-label">الاسم الكامل (اختياري)</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="full_name" 
            name="full_name" 
            class="form-input" 
            placeholder="مثال: فؤاد محمد"
          >
          <span class="input-icon">✨</span>
        </div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username" class="form-label">اسم المستخدم (Username) *</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="مثال: fouad_2026"
            required
            autocomplete="username"
            minlength="3"
            maxlength="50"
          >
          <span class="input-icon">👤</span>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">البريد الإلكتروني (Email) *</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">كلمة المرور (Password) *</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="6 أحرف على الأقل"
            required
            minlength="6"
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" title="إظهار / إخفاء كلمة المرور">
            👁️
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirm_password" class="form-label">تأكيد كلمة المرور *</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-input" 
            placeholder="أعد كتابة كلمة المرور"
            required
            minlength="6"
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm_password', this)" title="إظهار / إخفاء كلمة المرور">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem;">
        <span id="btn-text">إنشاء الحساب</span>
        <span id="btn-spinner" class="spinner" style="display: none;"></span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; color: var(--text-muted); font-size: 0.9rem;">
      لديك حساب بالفعل؟ 
      <a href="/login" style="color: var(--secondary); text-decoration: none; font-weight: 700;">تسجيل الدخول</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePasswordVisibility(fieldId, btn) {
  const input = document.getElementById(fieldId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🔒';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// Redirect if already authenticated
if (isAuthenticated()) {
  window.location.href = '/';
}

const form = document.getElementById('register-form');
const submitBtn = document.getElementById('submit-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlert('register-alert');

  const fullName = document.getElementById('full_name').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm_password').value;

  if (!username || !email || !password) {
    showAlert('register-alert', 'يرجى ملء جميع الحقول الإلزامية (*)', 'error');
    return;
  }

  if (password.length < 6) {
    showAlert('register-alert', 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل', 'error');
    return;
  }

  if (password !== confirmPassword) {
    showAlert('register-alert', 'كلمتا المرور غير متطابقتين', 'error');
    return;
  }

  // Set loading state
  submitBtn.disabled = true;
  btnText.textContent = 'جاري إنشاء الحساب...';
  btnSpinner.style.display = 'inline-block';

  try {
    // 1. Call Register API (API 1)
    await apiRequest('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        username: username,
        email: email,
        full_name: fullName || null,
        password: password
      })
    });

    // 2. Auto Login (API 2)
    btnText.textContent = 'تم التسجيل! جاري الدخول...';
    const loginData = await apiRequest('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username_or_email: username,
        password: password
      })
    });

    setAuthToken(loginData.access_token, loginData.user);
    showAlert('register-alert', 'تم إنشاء الحساب بنجاح! جاري توجيهك للصفحة الرئيسية...', 'success');

    setTimeout(() => {
      window.location.href = '/';
    }, 1000);

  } catch (err) {
    showAlert('register-alert', err.message || 'حدث خطأ أثناء إنشاء الحساب. يرجى المحاولة لاحقاً.', 'error');
    submitBtn.disabled = false;
    btnText.textContent = 'إنشاء الحساب';
    btnSpinner.style.display = 'none';
  }
});
</script>
{% endblock %}
