<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FastAPI Authentication Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="brand-logo">
      <div class="brand-icon">⚡</div>
      <span>FastAPI <span style="color: var(--secondary);">Auth</span></span>
    </a>

    <div class="nav-auth-buttons" id="nav-auth-section">
      <a href="/login" class="btn btn-secondary">تسجيل الدخول</a>
      <a href="/register" class="btn btn-primary">حساب جديد</a>
    </div>
  </nav>

  <!-- Main Content Body -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 FastAPI & PostgreSQL Portal • تم التطوير بأعلى معايير الأمان والأداء</p>
  </footer>

  <!-- Scripts -->
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/main.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
