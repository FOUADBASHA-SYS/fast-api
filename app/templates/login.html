{% extends "base.html" %}

{% block title %}تسجيل الدخول | FastAPI Auth{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="card-header">
      <h2 class="card-title">تسجيل الدخول</h2>
      <p class="card-subtitle">أدخل بيانات حسابك للمتابعة إلى النظام</p>
    </div>

    <!-- Notification Alert -->
    <div id="login-alert" class="alert"></div>

    <form id="login-form">
      <!-- Username or Email -->
      <div class="form-group">
        <label for="username_or_email" class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username_or_email" 
            name="username_or_email" 
            class="form-input" 
            placeholder="مثال: john_doe أو user@example.com"
            required
            autocomplete="username"
          >
          <span class="input-icon">👤</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">كلمة المرور</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" title="إظهار / إخفاء كلمة المرور">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem;">
        <span id="btn-text">تسجيل الدخول</span>
        <span id="btn-spinner" class="spinner" style="display: none;"></span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; color: var(--text-muted); font-size: 0.9rem;">
      ليس لديك حساب بعد؟ 
      <a href="/register" style="color: var(--secondary); text-decoration: none; font-weight: 700;">إنشاء حساب جديد</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePasswordVisibility(fieldId, btn) {
  const input = document.getElementById(fieldId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🔒';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// Redirect if already authenticated
if (isAuthenticated()) {
  window.location.href = '/';
}

const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlert('login-alert');

  const username_or_email = document.getElementById('username_or_email').value.trim();
  const password = document.getElementById('password').value;

  if (!username_or_email || !password) {
    showAlert('login-alert', 'يرجى إدخال جميع الحقول المطلوبة', 'error');
    return;
  }

  // Set loading state
  submitBtn.disabled = true;
  btnText.textContent = 'جاري التحقق...';
  btnSpinner.style.display = 'inline-block';

  try {
    const data = await apiRequest('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username_or_email: username_or_email,
        password: password
      })
    });

    // Save token and user details
    setAuthToken(data.access_token, data.user);
    showAlert('login-alert', 'تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');

    setTimeout(() => {
      window.location.href = '/';
    }, 800);

  } catch (err) {
    showAlert('login-alert', err.message || 'فشل تسجيل الدخول. يرجى التحقق من صحة البيانات.', 'error');
    submitBtn.disabled = false;
    btnText.textContent = 'تسجيل الدخول';
    btnSpinner.style.display = 'none';
  }
});
</script>
{% endblock %}
